title: "galan's blog"
subtitle: "技术与生活"
author: galanhao
language: zh-CN
timezone: Asia/Shanghai
url: "https://blog.galanhao.com"
root: /
per_page: 10
theme: congo

# Site-level visual assets.
# Place images under `assets/` (e.g. assets/img/favicon.ico) so they are
# copied to dist/assets/img/ during build.  Or use `static/` for root-level
# files (e.g. static/favicon.ico → dist/favicon.ico).
favicon: /assets/img/favicon.ico    # browser tab icon
avatar: /assets/img/avatar.png      # homepage profile avatar
banner: /assets/img/banner.jpg      # homepage banner image

permalink:
  format: date-full

nav:
  - name: 首页
    url: /
  - name: 归档
    url: /archives/
  - name: 关于
    url: /about/

deploy:
  pages: true

integrations:
  comment:
    provider: none
  analytics:
    provider: none
  pv:
    provider: none
  wallpaper:
    provider: none
